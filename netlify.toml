# Netlify configuration for P2PEX Next.js app
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Generate Prisma client (with Postgres provider) before building Next.js
  command = "npx prisma generate && npm run build"
  # Don't set publish directory — the Next.js plugin handles it
  # This is required for Next.js 13+ app router with SSR/ISR

[build.environment]
  # Pin Node version (matches Vercel default)
  NODE_VERSION = "20"
  # The DATABASE_URL must be set in Netlify UI (Site settings → Environment variables)
  # It should point to your Supabase Postgres instance, like:
  # postgresql://postgres.XXXX:password@aws-0-region.pooler.supabase.com:6543/postgres
  # DO NOT set DATABASE_URL here — set it in the Netlify UI as a sensitive variable.

# Required for Next.js on Netlify — auto-installs the Next.js runtime adapter
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serverless function settings — Postgres doesn't need bundled DB files
[functions]
  node_bundler = "esbuild"
  # Keep Prisma client external (don't bundle it — it has native binaries)
  external_node_modules = ["@prisma/client", "@prisma/engine-core"]

# Function timeout (max 26s on free tier) — set in Netlify UI:
# Site settings → Functions → Function timeout → 26

# Headers for security + caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirect rule — Next.js plugin handles most routing, but ensure root works
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
