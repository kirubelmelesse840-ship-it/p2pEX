# Netlify configuration for P2PEX Next.js app
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Generate Prisma client (with new SQLite provider) before building Next.js
  # `postinstall` hook in package.json also runs `prisma generate` — but we double up here for safety
  command = "npx prisma generate && npm run build"
  # Don't set publish directory — the Next.js plugin handles it
  # This is required for Next.js 13+ app router with SSR/ISR

[build.environment]
  # Pin Node version (matches Vercel default)
  NODE_VERSION = "20"
  # Database URL — relative path so it works on Netlify's build environment
  # Points to the SQLite file committed in the repo (db/custom.db)
  DATABASE_URL = "file:./db/custom.db"
  # Skip Prisma engine hash check (prevents "engine hash mismatch" errors
  # when binaries are downloaded from the CDN during build)
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING = "true"

# Required for Next.js on Netlify — auto-installs the Next.js runtime adapter
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js functions can run up to 26 seconds on Netlify free tier (vs Vercel's 10s default)
# This helps with the support chat upload + image processing routes
[functions]
  # Include the SQLite database file in the serverless function bundle
  # so Prisma can find it at runtime (otherwise SQLite returns error 14)
  included_files = ["db/custom.db", "prisma/schema.prisma"]

# Headers for security + caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirect rule — Next.js plugin handles most routing, but ensure root works
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
